<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Riwayat Transaksi - BeFAST</title>
  
  <link rel="icon" type="image/png" href="LOGO FIX.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen pb-10">

  <!-- Header Sederhana dengan Tombol Back yang Pasti Bisa Diklik -->
  <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-[100] border-b border-gray-200">
    <div class="max-w-[1200px] mx-auto px-4 py-4 flex items-center justify-between relative">
      <div class="flex items-center gap-4 relative z-10">
        <a href="index.html" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-blue-100 hover:text-blue-600 transition cursor-pointer relative z-20">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1 class="text-xl font-black text-[#1e3a8a]">Semua Transaksi</h1>
      </div>
      <img src="mascot-3d.png" alt="BeFAST" class="w-10 h-10 object-contain drop-shadow-sm">
    </div>
  </header>

  <!-- Konten Riwayat -->
  <main class="max-w-[1200px] mx-auto px-4 pt-8">
    <!-- KOTAK PENCARIAN REAL-TIME -->
    <div class="w-full flex justify-end mb-4">
      <div class="relative group w-full sm:w-64">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 group-focus-within:text-[#1e3a8a] transition-colors"></i>
        <input type="text" id="searchHistory" placeholder="Cari transaksi..." class="pl-11 pr-4 py-2.5 w-full rounded-full bg-white border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#1e3a8a]/50 text-sm font-semibold transition-all shadow-sm text-gray-700">
      </div>
    </div>
    
    <div class="glass-panel p-4 md:p-6 overflow-hidden">
      
      <!-- 1. TAMPILAN TABEL (Hanya muncul khusus di Desktop / md ke atas) -->
      <div class="hidden md:block overflow-x-auto no-scrollbar">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b-2 border-gray-200 text-gray-500 text-xs uppercase tracking-wider">
              <th class="p-3 font-black">Tanggal</th>
              <th class="p-3 font-black">Jenis</th>
              <th class="p-3 font-black">Kategori</th>
              <th class="p-3 font-black">Keterangan</th>
              <th class="p-3 font-black text-right">Nominal (Rp)</th>
              <th class="p-3 font-black text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBodyDesktop" class="text-sm">
            <tr><td colspan="6" class="p-6 text-center text-gray-400 font-bold">Memuat data dari database...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- 2. TAMPILAN CARD (Hanya muncul khusus di Mobile / Layar HP) -->
      <div id="tableBodyMobile" class="md:hidden flex flex-col gap-3">
        <p class="p-6 text-center text-gray-400 font-bold">Memuat data dari database...</p>
      </div>

    </div>
  </main>

  <!-- Menggunakan config.js untuk koneksi database -->
  <script src="js/config.js"></script>
  
  <script>
    // Logika Khusus Halaman Riwayat
    document.addEventListener('DOMContentLoaded', async () => {
      const userStr = localStorage.getItem('bf_user');
      if (!userStr || !supabaseClient) {
        window.location.href = 'index.html'; 
        return;
      }
      
      const user = JSON.parse(userStr);
      const desktopBody = document.getElementById('tableBodyDesktop');
      const mobileBody = document.getElementById('tableBodyMobile');

      // Ambil data dari Supabase
      const { data, error } = await supabaseClient
        .from('transactions')
        .select('*')
        .eq('user_id', user.id)
        .order('date', { ascending: false });

      if (error) {
        desktopBody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-red-500 font-bold">Gagal memuat data.</td></tr>`;
        mobileBody.innerHTML = `<p class="p-6 text-center text-red-500 font-bold">Gagal memuat data.</p>`;
        return;
      }

      if (!data || data.length === 0) {
        desktopBody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-gray-400 font-bold">Belum ada riwayat transaksi.</td></tr>`;
        mobileBody.innerHTML = `<p class="p-6 text-center text-gray-400 font-bold">Belum ada riwayat transaksi.</p>`;
        return;
      }

      // Render Tampilan untuk Desktop & Mobile Secara Bersamaan
      desktopBody.innerHTML = '';
      mobileBody.innerHTML = '';

      data.forEach((t, index) => {
        const isIncome = t.type === 'pemasukan';
        const typeBadge = isIncome 
          ? `<span class="bg-green-100 text-green-700 px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider">Pemasukan</span>`
          : `<span class="bg-red-100 text-red-700 px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider">Pengeluaran</span>`;
        
        const amountColor = isIncome ? 'text-green-600' : 'text-red-600';
        const amountSign = isIncome ? '+' : '-';
        
        // --- 1. CETAK KE TABEL (DESKTOP) ---
        const rowBg = index % 2 === 0 ? 'bg-transparent' : 'bg-gray-50/50';
        const tr = document.createElement('tr');
        tr.className = `border-b border-gray-100 hover:bg-blue-50/50 transition ${rowBg} searchable-row`;
        tr.innerHTML = `
          <td class="p-3 font-semibold text-gray-600 whitespace-nowrap">${t.date}</td>
          <td class="p-3">${typeBadge}</td>
          <td class="p-3 font-bold text-gray-700 whitespace-nowrap">${t.category || '-'}</td>
          <td class="p-3 font-semibold text-gray-800">${t.desc}</td>
          <td class="p-3 font-black ${amountColor} text-right whitespace-nowrap">${amountSign} Rp ${Number(t.amount).toLocaleString('id-ID')}</td>
          <td class="p-3 text-center">
            <button onclick="deleteTransaction('${t.id}')" class="w-8 h-8 rounded-full bg-red-50 text-red-500 hover:bg-red-500 hover:text-white transition" title="Hapus">
              <i class="fa-solid fa-trash text-xs"></i>
            </button>
          </td>
        `;
        desktopBody.appendChild(tr);

        // --- 2. CETAK KE CARD (MOBILE) ---
        const cardDiv = document.createElement('div');
        cardDiv.className = "bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between searchable-row";
        cardDiv.innerHTML = `
          <div class="flex flex-col gap-1 min-w-0 pr-3">
            <div class="flex items-center gap-2">
              ${typeBadge}
              <span class="text-[10px] text-gray-400 font-semibold">• ${t.date}</span>
            </div>
            <h4 class="font-bold text-sm text-gray-800 truncate mt-0.5">${t.desc}</h4>
            <p class="text-[10px] text-gray-500 font-medium">${t.category || '-'}</p>
          </div>
          <div class="flex flex-col items-end shrink-0">
            <p class="font-black text-sm ${amountColor}">${amountSign} Rp ${Number(t.amount).toLocaleString('id-ID')}</p>
            <button onclick="deleteTransaction('${t.id}')" class="mt-2 w-7 h-7 rounded-full bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-500 hover:text-white transition">
              <i class="fa-solid fa-trash text-[10px]"></i>
            </button>
          </div>
        `;
        mobileBody.appendChild(cardDiv);
      });
    });

    // Fungsi Hapus Transaksi
    async function deleteTransaction(id) {
      if(confirm('Yakin ingin menghapus transaksi ini?')) {
        const { error } = await supabaseClient.from('transactions').delete().eq('id', id);
        if(!error) {
          location.reload(); 
        } else {
          alert("Gagal menghapus data.");
        }
      }
    }

    // Fitur Pencarian Real-Time
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('searchHistory');
      
      searchInput.addEventListener('input', function() {
        const keyword = this.value.toLowerCase();
        const rows = document.querySelectorAll('.searchable-row');

        rows.forEach(row => {
          const rowText = row.innerText.toLowerCase();
          if (rowText.includes(keyword)) {
            row.style.display = '';
          } else {
            row.style.display = 'none';
          }
        });
      });
    });
  </script>
</body>
</html>
